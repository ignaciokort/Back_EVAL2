version: '3.8'

services:
  backend:
    build: .
    container_name: back-container
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db-mysql
      - DB_USER=root
      - DB_PASSWORD=admin
      - DB_NAME=proyecto_db
    depends_on:
      - db-mysql

  db-mysql:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=admin
      - MYSQL_DATABASE=proyecto_db
    volumes:
      - db_data:/var/lib/mysql
      # Aquí cumplimos con el IE3 (Persistencia)
    restart: always

volumes:
  db_data:
