name: Deploy Backend with Compose
on:
  push:
    [cite_start]branches: [ "deploy" ] # Cumple con IE4 (20% de la nota) [cite: 14, 44]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_BACK_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Asegurar que Docker y Docker Compose existan
            sudo apt-get update && sudo apt-get install -y docker-compose
            
            # 2. Dar permisos al socket de Docker
            sudo chmod 666 /var/run/docker.sock
            
            # 3. Limpiar contenedores viejos para evitar conflictos
            docker stop back-container mysql-db || true
            docker rm back-container mysql-db || true
            
            # 4. Limpiar y clonar la rama deploy (IE4) [cite: 113, 145]
            sudo rm -rf Back_Eval2
            git clone -b deploy https://github.com/ignaciokort/Back_Eval2.git
            cd Back_Eval2
            
            # 5. Crear el archivo de configuración .env (IE1) [cite: 31, 93]
            echo "DB_HOST=db-mysql" > .env
            echo "DB_USER=root" >> .env
            echo "DB_PASSWORD=admin" >> .env
            echo "DB_NAME=proyecto_db" >> .env
            echo "PORT=3000" >> .env
            
            # 6. Levantar todo con Docker Compose (IE2 y IE3) [cite: 30, 33, 92]
            docker compose down
            docker compose up -d --build
