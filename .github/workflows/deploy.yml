name: Deploy Backend with Compose
on:
  push:
    branches: [ "deploy" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_BACK_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Asegurar permisos y herramientas
            sudo chmod 666 /var/run/docker.sock
            sudo apt-get update && sudo apt-get install -y docker-compose
            
            # 2. Limpiar para evitar el error de "Conflict"
            docker stop back-container mysql-db || true
            docker rm back-container mysql-db || true
            
            # 3. Actualizar código de la rama deploy
            sudo rm -rf Back_Eval2
            git clone -b deploy https://github.com/ignaciokort/Back_Eval2.git
            cd Back_Eval2
            
            # 4. Configurar variables de entorno (IE1/IE7)
            echo "DB_HOST=db-mysql" > .env
            echo "DB_USER=root" >> .env
            echo "DB_PASSWORD=admin" >> .env
            echo "DB_NAME=proyecto_db" >> .env
            echo "PORT=3000" >> .env
            
            # 5. Desplegar stack completo (IE2/IE3)
            docker compose down
            docker compose up -d --build
