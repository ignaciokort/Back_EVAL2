name: Deploy Backend with Compose
on:
  push:
    # IMPORTANTE: Aquí cumplimos con el requisito de la pauta
    branches: [ "deploy" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_BACK_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Dar permisos a Docker
            sudo chmod 666 /var/run/docker.sock
            
            # Limpiar y clonar la rama específica 'deploy'
            sudo rm -rf Back_Eval2
            git clone -b deploy https://github.com/ignaciokort/Back_Eval2.git
            cd Back_Eval2
            
            # Crear el archivo de variables para que el backend sepa dónde está la DB
            echo "DB_HOST=db-mysql" > .env
            echo "DB_USER=root" >> .env
            echo "DB_PASSWORD=admin" >> .env
            echo "DB_NAME=proyecto_db" >> .env
            echo "PORT=3000" >> .env
            
            # Levantar todo usando el docker-compose.yml
            # Esto levanta la API y la Base de Datos al mismo tiempo
            docker-compose down
            docker-compose up -d --build
